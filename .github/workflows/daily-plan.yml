
name: Quiet Place - Daily Content Studio

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  create-plan:
    name: Generate daily content plan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate Quiet Place content
        run: python scripts/create_daily_plan.py

      - name: Save daily content package
        uses: actions/upload-artifact@v5
        with:
          name: quiet-place-daily-content
          path: output/daily-plan.md
          retention-days: 7
