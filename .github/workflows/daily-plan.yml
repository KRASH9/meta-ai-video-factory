name: Quiet Place - Daily Content Studio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Winter schedule: 04:00 UTC = 05:00 in Warsaw. Change to 03:00 UTC during summer time.
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  group: quiet-place-content-generation
  cancel-in-progress: false

jobs:
  create-plan:
    name: Generate daily content plan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate Quiet Place content
        run: python scripts/create_daily_plan.py

      - name: Include legal pages in website
        run: |
          cp terms.html output/terms.html
          cp privacy.html output/privacy.html
          cp tiktok8WMSXUWisvE0Ks0g0rvHq3k2SNivdsf3.txt output/tiktok8WMSXUWisvE0Ks0g0rvHq3k2SNivdsf3.txt

      - name: Save daily content package
        uses: actions/upload-artifact@v5
        with:
          name: quiet-place-daily-content
          path: output/
          retention-days: 7
