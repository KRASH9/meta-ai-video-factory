name: Quiet Place - Daily Content Studio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Check both DST offsets; the gate runs only at 05:00 Warsaw time.
    - cron: "0 3,4 * * *"

permissions:
  contents: read

concurrency:
  group: quiet-place-content-generation
  cancel-in-progress: false

jobs:
  create-plan:
    name: Generate daily content plan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check Warsaw schedule time
        id: timecheck
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Europe/Warsaw date +%H)" = "05" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/checkout@v5

      - name: Set up Python
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate Quiet Place content
        if: steps.timecheck.outputs.run == 'true'
        run: python scripts/create_daily_plan.py

      - name: Include legal pages in website
        if: steps.timecheck.outputs.run == 'true'
        run: |
          cp terms.html output/terms.html
          cp privacy.html output/privacy.html
          cp tiktok8WMSXUWisvE0Ks0g0rvHq3k2SNivdsf3.txt output/tiktok8WMSXUWisvE0Ks0g0rvHq3k2SNivdsf3.txt

      - name: Save daily content package
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: quiet-place-daily-content
          path: output/
          retention-days: 7
