name: Quiet Place - Daily Content Studio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 03:00 UTC is 05:00 in Warsaw during summer; winter waits one hour in the job.
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: quiet-place-content-generation
  cancel-in-progress: false

jobs:
  create-plan:
    name: Generate daily content plan
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Wait until 05:00 Warsaw time (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import time
          tz = ZoneInfo("Europe/Warsaw")
          now = datetime.now(tz)
          target = now.replace(hour=5, minute=0, second=0, microsecond=0)
          if now < target:
              seconds = (target - now).total_seconds()
              print(f"Waiting {seconds:.0f}s until 05:00 Warsaw time")
              time.sleep(seconds)
          print("Warsaw local time:", datetime.now(tz).isoformat())
          PY

      - name: Generate Quiet Place content
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/create_daily_plan.py --scheduled
          else
            python scripts/create_daily_plan.py
          fi

      - name: Validate generated pages and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          out = Path("output")
          pages = ["index.html", "content.html", "history.html", "calendar.html", "analytics.html"]
          for name in pages:
              html = (out / name).read_text(encoding="utf-8")
              scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
              if not scripts:
                  raise SystemExit(f"No inline script found in {name}")
              Path(f"/tmp/{name}.js").write_text("\n".join(scripts), encoding="utf-8")
              print(f"Validated {name}; scripts: {len(scripts)}")
          content = (out / "content.html").read_text(encoding="utf-8")
          assert content.count('class="prompt-options"') == 3, "Expected prompt options data for all three cards"
          assert content.count('class="prompt-refresh"') == 3, "Expected visible update button on all three cards"
          assert 'class="force-refresh"' not in content, "Refresh icon must be removed"
          assert content.count('class="card"') == 3, "Expected exactly three content cards"
          assert "setupPromptRefresh();" in content, "Refresh handler is not initialized"
          print("Content card and refresh-control checks passed")
          PY
          for f in /tmp/*.html.js; do echo "Checking JavaScript: $f"; node --check "$f"; done

      - name: Include legal pages in website
        run: |
          cp terms.html output/terms.html
          cp privacy.html output/privacy.html
          cp tiktok8WMSXUWisvE0Ks0g0rvHq3k2SNivdsf3.txt output/tiktok8WMSXUWisvE0Ks0g0rvHq3k2SNivdsf3.txt

      - name: Save daily content package
        uses: actions/upload-artifact@v5
        with:
          name: quiet-place-daily-content
          path: output/
          retention-days: 7
